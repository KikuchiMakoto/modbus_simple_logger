name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and deploy are two jobs on purpose.
  #
  # They used to be one, and that made every retry a trap: artifacts belong to
  # the RUN, not to the attempt, so a second attempt uploaded a second artifact
  # called `github-pages` next to the first one. deploy-pages looks the artifact
  # up by name and refuses a run with more than one ("Multiple artifacts named
  # 'github-pages' were unexpectedly found … Artifact count is 2"). Run #251
  # died that way twice after its first attempt hit the deploy timeout — the
  # re-run could not have succeeded, because the upload it repeated is what
  # broke it.
  #
  # Split, "Re-run failed jobs" re-runs `deploy` alone, which uploads nothing.
  # A full re-run of both jobs still duplicates, so on the rare occasion the
  # build itself has to run again, start a fresh run (Run workflow) instead.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Ahead of the build to match the upstream template. Nothing here reads
      # its outputs — vite.config.ts hardcodes `base`, since the same bundle is
      # also served by the launcher.
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
