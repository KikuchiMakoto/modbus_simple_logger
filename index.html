<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModbusSimpleLogger</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Modbus WebUSB data logger and visualization tool" />
    <link rel="manifest" href="manifest.json" />
    <!-- PNG, not SVG: the "SVG" this replaced was a 945x945 PNG wrapped in an
         <image> element, so there was never any vector artwork to lose — only
         the 33% base64 overhead of carrying it that way, on an asset the
         Service Worker precaches and the launcher exe embeds. -->
    <link rel="icon" type="image/png" href="icon.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Modbus Simple Logger" />
  </head>
  <body class="bg-slate-950 text-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
