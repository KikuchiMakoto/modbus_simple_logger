<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModbusSimpleLogger</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Modbus WebUSB data logger and visualization tool" />
    <!--
      crossorigin="use-credentials" because of the viewer server: a manifest is
      fetched with credentials omitted by default, so the msl_viewer cookie was
      not sent, the token check refused it, and every remote-monitoring page
      load logged a 403 for the manifest. This does not weaken that check — it
      makes the request carry the cookie the check is looking for.
    -->
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Modbus Logger" />
  </head>
  <body class="bg-slate-950 text-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
